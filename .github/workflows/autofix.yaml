---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: suzuki-shunsuke/go-autofix-action@2c7f494d0149fe60c0adc9feb09b6b995bae00ec # v0.2.0
        with:
          aqua_version: v2.64.0
          takumi_guard_bot_id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
