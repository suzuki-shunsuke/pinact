---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - fix
    steps:
      - run: exit 1

  fix:
    uses: suzuki-shunsuke/go-autofix-action/.github/workflows/autofix-ci.yaml@af0e6434d892c2d37e78604a9ebd9c18e87e8cdc # v0.2.3
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.66.1
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
