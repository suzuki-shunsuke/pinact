---
name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  integration-test:
    uses: ./.github/workflows/workflow_call_integration_test.yaml
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: read
      id-token: write

  test:
    uses: suzuki-shunsuke/go-test-full-workflow/.github/workflows/test.yaml@6e3ab6f9508fec552b5890e7710d6cdef4489d22 # v6.0.1
    with:
      aqua_version: v2.62.1
      golangci-lint-timeout: 120s
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: write
      contents: read
      id-token: write
