---
name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  # Download Go modules once and share them with integration-test and test
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.65.2
      aqua_packages: go-licenses # go-test-workflow requires go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  integration-test:
    needs: [gomodule]
    uses: ./.github/workflows/workflow_call_integration_test.yaml
    permissions:
      contents: read

  test:
    needs: [gomodule]
    uses: suzuki-shunsuke/go-test-workflow/.github/workflows/test.yaml@ff8934b3958ec0c1b0a6fce445052e2d2a42e8c9 # v3.2.4
    with:
      aqua_version: v2.65.2
      golangci-lint-timeout: 120s
      gomodule_artifact_name: gomodule
      go-version-file: go.mod
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: write
      contents: read
      id-token: write

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@51ece8dcaabff59820bfb2053c56e3cb281cf7b2 # v0.0.1
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read
