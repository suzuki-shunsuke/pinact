---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@62f819ca556fa57c4a92fcefb393a5fbab4fe73e # v10.0.2
    with:
      go-version-file: go.mod
      aqua_version: v2.64.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
