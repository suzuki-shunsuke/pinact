---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@7991a2f919c47c4d26ec592ec28dd0066bda28a0 # v10.0.0
    with:
      go-version-file: go.mod
      aqua_version: v2.63.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
